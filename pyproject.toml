[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-assistant"
version = "0.1.0"
description = "AI Executive Assistant — a personal digital chief of staff."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
    "rich>=13.7.0",
    "google-auth>=2.0.0",
    "google-auth-oauthlib>=1.0.0",
    "google-api-python-client>=2.0.0",
    # `.xlsx` raporu bir ek özellik değil, motorun iki çıktısından biri
    # (ai_assistant.analysis.excel_report) — ve Excel dosyalarını OKUMAK da
    # buna bağlı (ai_assistant.analysis.dataset.load_excel). Kod eksik kurulumu
    # yakalayıp Türkçe bir DatasetError'a çeviriyor; o ağ hâlâ yerinde duruyor
    # ama artık son çare, varsayılan değil. Bağımlılık burada olmadığı sürece
    # temiz bir kurulumda Excel yolu sessizce ölüydü ve testler bunu görmüyordu.
    "openpyxl>=3.1.0",
    # `import pytz` modül düzeyinde yapılıyor
    # (ai_assistant.integrations.notification_manager) — try/except ile
    # sarılmamış, yani paket yoksa modül import edilemez ve bildirimlere dokunan
    # her test toplama (collection) aşamasında çöker. Bu bir runtime
    # bağımlılığıdır, dev değil; kullanıcı kurulumunda da gereklidir.
    # SİLMEYİN: notification_manager'daki import kaldırılmadıkça bu satır kalmalı.
    "pytz>=2023.3",
]

[project.optional-dependencies]
dev = [
    # Üst sınır bilinçli: 61 kök test `@pytest.mark.asyncio` kullanıyor ve
    # pytest 10 ile birlikte tanınmayan mark'lar uyarı değil HATA sayılıyor.
    # Sınır olmadan CI kendiliğinden yeni major'a atlayıp suite'i kırıyor.
    "pytest>=8.0.0,<10",
    # Async testler bu eklenti olmadan "skipped" olarak sessizce geçiliyordu.
    "pytest-asyncio>=0.21.1",
]

[project.scripts]
ai-assistant-check = "ai_assistant.health:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
# backend/pytest.ini bunu yıllardır ayarlıyordu ama kök suite'e uygulanmıyordu;
# kök testler `@pytest.mark.asyncio` yazsa da eklenti strict modda olduğu için
# koşmuyordu. "auto" ile async test fonksiyonları otomatik olarak çalıştırılır.
asyncio_mode = "auto"

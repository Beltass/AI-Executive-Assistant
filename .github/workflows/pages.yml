name: Deploy Dashboard to Pages

# Publishes the static agent dashboard in `frontend/` to GitHub Pages.
#
# This is the FALLBACK host: the primary is Vercel (the connected project's
# root directory is `frontend`, so it serves these files with zero config).
# Pages costs nothing and keeps the dashboard reachable even if the Vercel
# project is disconnected.
#
# SETUP: `enablement: true` below asks GitHub to turn Pages on (build type
# "GitHub Actions") the first time this workflow runs, so no manual step should
# be needed. If the token is not allowed to do that, the run fails on the
# "Configure Pages" step with "Get Pages site failed" — in that case do it by
# hand ONCE: Settings → Pages → Source: "GitHub Actions". Either way nothing
# else in the repository is affected.
#
# Published URL: https://beltass.github.io/AI-Executive-Assistant/
#
# WHY `workflow_run` IS HERE — the stale-dashboard bug
# ----------------------------------------------------
# The Daily Briefing job commits `frontend/status.json` and `frontend/reports/`
# back to `main` at the end of every run. That commit used to reach the
# repository and stop there: the live site kept serving an older build, so the
# dashboard showed an old run (11 agents) while the file in git already had the
# new one. TWO independent reasons, both real:
#
#   1. the commit message carried `[skip ci]`, which tells GitHub to skip EVERY
#      workflow for that push — including this one (now removed);
#   2. more fundamentally, a push made with the default `GITHUB_TOKEN` NEVER
#      triggers another workflow run. That is a deliberate GitHub rule against
#      recursion, and no commit message can change it.
#
# So the `push` trigger below can never fire for the briefing's own commit. The
# `workflow_run` trigger can: it listens for the Daily Briefing WORKFLOW
# finishing, not for its commit, and by then the new files are already on
# `main`. The `push` trigger stays for ordinary human edits to `frontend/`.
#
# NO LOOP IS POSSIBLE: this workflow only reads the repository and publishes
# Pages — it pushes nothing — and `daily-briefing.yml` is triggered ONLY by
# `schedule` and `workflow_dispatch`, never by `push` or `workflow_run`. The
# trigger graph is a straight line: briefing → pages.
on:
  push:
    branches: [main]
    # Only the dashboard is worth a redeploy.
    paths:
      - "frontend/**"
      - ".github/workflows/pages.yml"
  workflow_run:
    workflows: ["Daily Briefing"]
    # `completed` covers success AND failure on purpose: a failed run still
    # writes a status file, and showing that failure is the whole point.
    types: [completed]
  workflow_dispatch: {}

# Read the repo, mint the OIDC token deploy-pages needs, publish to Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# One live deployment at a time. `cancel-in-progress: false` lets an in-flight
# publish finish rather than leaving the site half-updated.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          # Explicit: on a `workflow_run` event the checked-out ref is not
          # guaranteed to be the tip of the default branch, and the whole point
          # of this run is to publish the commit the briefing just pushed.
          ref: main

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          # Create the Pages site (source: GitHub Actions) if it does not exist
          # yet, instead of failing and waiting for someone to click through
          # Settings → Pages.
          enablement: true

      - name: Upload dashboard artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # A pure static site: no build step, the directory ships as-is.
          path: frontend

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

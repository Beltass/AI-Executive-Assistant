name: Advisor Slack Bridge - Daily Updates

on:
  schedule:
    # Run at 07:00 UTC every day
    - cron: '0 7 * * *'

  # Manual trigger for testing
  workflow_dispatch:

jobs:
  advisor-daily-updates:
    name: Send Daily Advisor Updates to Slack
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Configure environment
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
          SLACK_ADVISOR_BRIDGE_ENABLED: 'true'
          SLACK_ADVISOR_UPDATE_HOUR: '7'
          SLACK_ADVISOR_INCLUDE: 'data_analyst,linkedin_coach,social_media_coach,personal_assistant'
        run: |
          # Export environment variables for Python subprocess
          echo "SLACK_BOT_TOKEN=$SLACK_BOT_TOKEN" >> $GITHUB_ENV
          echo "GOOGLE_CLIENT_ID=$GOOGLE_CLIENT_ID" >> $GITHUB_ENV
          echo "GOOGLE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET" >> $GITHUB_ENV
          echo "GOOGLE_REFRESH_TOKEN=$GOOGLE_REFRESH_TOKEN" >> $GITHUB_ENV
          echo "GOOGLE_DRIVE_FOLDER_ID=$GOOGLE_DRIVE_FOLDER_ID" >> $GITHUB_ENV
          echo "SLACK_ADVISOR_BRIDGE_ENABLED=$SLACK_ADVISOR_BRIDGE_ENABLED" >> $GITHUB_ENV
          echo "SLACK_ADVISOR_UPDATE_HOUR=$SLACK_ADVISOR_UPDATE_HOUR" >> $GITHUB_ENV
          echo "SLACK_ADVISOR_INCLUDE=$SLACK_ADVISOR_INCLUDE" >> $GITHUB_ENV

      - name: Run Advisor Daily Updates
        run: |
          python -m ai_assistant.integrations.advisor_daily_scheduler

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: advisor-update-logs
          path: logs/
          retention-days: 7

  process-advisor-requests:
    name: Process Pending Advisor Requests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # Run every 5 minutes during business hours (9-18 UTC, Mon-Fri)
    if: |
      github.event_name == 'schedule' &&
      (github.run_number % 6 == 0) &&
      contains('1,2,3,4,5', github.run_number % 7)

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Configure environment
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
          SLACK_ADVISOR_REQUEST_ENABLED: 'true'
        run: |
          echo "SLACK_BOT_TOKEN=$SLACK_BOT_TOKEN" >> $GITHUB_ENV
          echo "GOOGLE_CLIENT_ID=$GOOGLE_CLIENT_ID" >> $GITHUB_ENV
          echo "GOOGLE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET" >> $GITHUB_ENV
          echo "GOOGLE_REFRESH_TOKEN=$GOOGLE_REFRESH_TOKEN" >> $GITHUB_ENV
          echo "GOOGLE_DRIVE_FOLDER_ID=$GOOGLE_DRIVE_FOLDER_ID" >> $GITHUB_ENV
          echo "SLACK_ADVISOR_REQUEST_ENABLED=$SLACK_ADVISOR_REQUEST_ENABLED" >> $GITHUB_ENV

      - name: Process Advisor Requests
        run: |
          python -m ai_assistant.integrations.slack_advisor_bridge --process-requests

      - name: Cleanup old requests
        run: |
          python -c "
          from ai_assistant.integrations.slack_advisor_bridge import AdvisorRequestManager
          import asyncio

          async def cleanup():
              manager = AdvisorRequestManager()
              removed = await manager.cleanup_old_requests(days=30)
              print(f'Cleaned up {removed} requests older than 30 days')

          asyncio.run(cleanup())
          "

name: Daily Briefing

# Runs the supervised advisor team and posts the Turkish daily digest to Slack.
on:
  schedule:
    # "0 7 * * *" UTC = 10:00 İstanbul (UTC+3). GitHub Actions cron is ALWAYS
    # interpreted in UTC, so shift this value (not a timezone setting) to move
    # the delivery time. Scheduled runs are best-effort and can be delayed by a
    # few minutes when GitHub is under load.
    # https://crontab.guru/ helps translate the schedule.
    - cron: "0 7 * * *"
  workflow_dispatch: {}

jobs:
  briefing:
    runs-on: ubuntu-latest
    # The accountability coach's streak file is committed back to the default
    # branch after every run, which is what makes its memory survive the
    # ephemeral runner. Nothing else in this job writes to the repository.
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          # Commit the state file back to the default branch, not to a detached
          # HEAD, and keep the token available for that push.
          ref: main
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Build and send daily digest
        env:
          # Weather advisor (Open-Meteo, no key required). An unset secret is an
          # empty string, which falls back to the built-in default ("Istanbul").
          WEATHER_CITY: ${{ secrets.WEATHER_CITY }}
          WEATHER_COUNTRY: ${{ secrets.WEATHER_COUNTRY }}
          # LLM provider — either key activates the persona advisors.
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          # The whole advisor team is served by ONE batched Gemini call, which
          # is what fits the free-tier quota (nine separate calls did not).
          DIGEST_BATCH_MODE: "true"
          # That single answer carries every section, so give it room and time.
          GEMINI_TIMEOUT_SECONDS: "300"
          # Hard ceiling on ALL LLM work in one run. Retries multiply with the
          # model fallback chain and again with the per-advisor path, so an
          # exhausted free-tier quota could otherwise stretch this job past an
          # hour. When the budget is spent the remaining sections fail fast and
          # the digest still goes out (weather + real RSS headlines included).
          LLM_TIME_BUDGET_SECONDS: "600"
          # Space out any remaining sequential Gemini calls (the per-advisor
          # fallback path) so the free-tier quota window doesn't 429 them.
          # Combined with the built-in 429/5xx retry + model fallback, this lets
          # more sections complete on the free tier.
          GEMINI_REQUEST_SPACING_SECONDS: "8"
          # Slack delivery — webhook OR bot token + channel.
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL: ${{ secrets.SLACK_CHANNEL }}
          # Phase 2 advisors — all optional; a missing secret falls back to the
          # built-in default (except ANKA_*, which has none by design).
          JOB_KEYWORDS: ${{ secrets.JOB_KEYWORDS }}
          JOB_LOCATION: ${{ secrets.JOB_LOCATION }}
          USER_SECTOR: ${{ secrets.USER_SECTOR }}
          AI_NEWS_RSS_URL: ${{ secrets.AI_NEWS_RSS_URL }}
          SECTOR_NEWS_RSS_URL: ${{ secrets.SECTOR_NEWS_RSS_URL }}
          ANKA_WEBHOOK_URL: ${{ secrets.ANKA_WEBHOOK_URL }}
          ANKA_API_KEY: ${{ secrets.ANKA_API_KEY }}
          # Phase 3 advisors — all optional, all with built-in defaults.
          # Banking & contact-center project expert: news feed for real links.
          BANKING_NEWS_RSS_URL: ${{ secrets.BANKING_NEWS_RSS_URL }}
          BANKING_SECURITY_RSS_URL: ${{ secrets.BANKING_SECURITY_RSS_URL }}
          # Accountability coach state file. Leave this secret UNSET so the
          # built-in default (.assistant_state/accountability.json) is used —
          # that is the path the commit-back step below persists. Pointing it
          # somewhere else silently disables the durable streak.
          ACCOUNTABILITY_STATE_FILE: ${{ secrets.ACCOUNTABILITY_STATE_FILE }}
          # Start-of-day ops briefing (Gmail + Calendar). There is no token file
          # on a runner, so the one-time local login's refresh token is passed
          # through the environment instead. Without these three the section
          # simply stays `skipped`.
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          # These only bound how much recent mail is read.
          OPS_BRIEFING_MAX_EMAILS: ${{ secrets.OPS_BRIEFING_MAX_EMAILS }}
          OPS_BRIEFING_EMAIL_WINDOW: ${{ secrets.OPS_BRIEFING_EMAIL_WINDOW }}
        run: python -m ai_assistant.notifiers.slack_notifier

      # The runner filesystem is thrown away, so the coach's streak/task memory
      # is persisted by committing it back to `main`. Runs even when the
      # briefing step failed (partial state is still worth keeping) and NEVER
      # fails the job: `continue-on-error` plus an always-succeeding script mean
      # a race or a protected branch can cost the streak, never the briefing.
      - name: Persist accountability state
        if: always()
        continue-on-error: true
        env:
          STATE_FILE: .assistant_state/accountability.json
        run: |
          set -u
          if [ ! -f "$STATE_FILE" ]; then
            echo "No state file at $STATE_FILE — nothing to persist."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "$STATE_FILE"
          if git diff --cached --quiet -- "$STATE_FILE"; then
            echo "Accountability state unchanged — nothing to commit."
            exit 0
          fi
          git commit -m "chore: persist accountability state [skip ci]" -- "$STATE_FILE"
          # Another run (or a merge) may have moved main in the meantime, so
          # rebase and retry a few times before giving up.
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              echo "Accountability state pushed on attempt $attempt."
              exit 0
            fi
            echo "Push failed (attempt $attempt); rebasing onto origin/main."
            git pull --rebase --autostash origin main || break
            sleep $((attempt * 5))
          done
          echo "Could not persist accountability state; the streak restarts next run."
          exit 0

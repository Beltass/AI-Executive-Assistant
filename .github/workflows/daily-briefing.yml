name: Daily Briefing

# Runs the supervised advisor team and posts the Turkish digest to Slack.
#
# FOUR runs a day, but only ONE full briefing:
#   07:00 UTC = 10:00 İstanbul -> mode "full"        (the flagship briefing)
#   11:00 UTC = 14:00 İstanbul -> mode "incremental" (only what is new)
#   15:00 UTC = 18:00 İstanbul -> mode "incremental"
#   19:00 UTC = 22:00 İstanbul -> mode "incremental"
# An incremental run reports ONLY findings the user has not been told yet
# (see src/ai_assistant/memory.py), skips the model call when nobody has
# anything new, and stays out of Slack entirely on a quiet run — so the extra
# runs cost almost no free-tier quota and never spam the channel.
on:
  schedule:
    # GitHub Actions cron is ALWAYS interpreted in UTC, so shift these values
    # (not a timezone setting) to move the delivery times. Scheduled runs are
    # best-effort and can be delayed by a few minutes when GitHub is under
    # load. https://crontab.guru/ helps translate the schedule.
    - cron: "0 7 * * *"
    - cron: "0 11,15,19 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Run mode: full (complete briefing) or incremental (only new findings)"
        type: choice
        required: false
        default: full
        options:
          - full
          - incremental

# Four scheduled runs a day plus manual ones commit state back to `main`, so
# they must QUEUE instead of racing each other into a rejected push.
concurrency:
  group: daily-briefing
  cancel-in-progress: false

jobs:
  briefing:
    runs-on: ubuntu-latest
    # The accountability coach's streak file and the dashboard's status.json
    # are committed back to the default branch after every run, which is what
    # makes the coach's memory survive the ephemeral runner and what feeds the
    # static dashboard. Nothing else in this job writes to the repository.
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          # Commit the state file back to the default branch, not to a detached
          # HEAD, and keep the token available for that push.
          ref: main
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      # Which kind of run is this? A manual dispatch says so explicitly; a
      # scheduled one is derived from the cron line that triggered it, so the
      # 10:00 İstanbul run stays the full briefing and the rest top it up.
      - name: Determine run mode
        env:
          SCHEDULE: ${{ github.event.schedule }}
          INPUT_MODE: ${{ inputs.mode }}
          FULL_SCHEDULE: "0 7 * * *"
        run: |
          set -u
          if [ -n "$INPUT_MODE" ]; then
            MODE="$INPUT_MODE"
          elif [ -z "$SCHEDULE" ]; then
            MODE="full"
          elif [ "$SCHEDULE" = "$FULL_SCHEDULE" ]; then
            MODE="full"
          else
            MODE="incremental"
          fi
          echo "BRIEFING_MODE=$MODE" >> "$GITHUB_ENV"
          echo "Run mode: $MODE (schedule: '${SCHEDULE:-manual}')"

      - name: Build and send daily digest
        env:
          # LLM provider — either key activates the persona advisors.
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          # The whole advisor team is served by ONE batched Gemini call, which
          # is what fits the free-tier quota (nine separate calls did not).
          DIGEST_BATCH_MODE: "true"
          # That single answer carries every section, so give it room and time.
          GEMINI_TIMEOUT_SECONDS: "300"
          # Hard ceiling on ALL LLM work in one run. Retries multiply with the
          # model fallback chain and again with the per-advisor path, so an
          # exhausted free-tier quota could otherwise stretch this job past an
          # hour. When the budget is spent the remaining sections fail fast and
          # the digest still goes out (real RSS headlines included).
          LLM_TIME_BUDGET_SECONDS: "600"
          # Space out any remaining sequential Gemini calls (the per-advisor
          # fallback path) so the free-tier quota window doesn't 429 them.
          # Combined with the built-in 429/5xx retry + model fallback, this lets
          # more sections complete on the free tier.
          GEMINI_REQUEST_SPACING_SECONDS: "8"
          # Where the published dashboard lives. Slack no longer carries the
          # briefing itself — it carries one line per advisor plus a link to
          # that advisor's report document on this site. An unset secret falls
          # back to the built-in GitHub Pages URL.
          DASHBOARD_BASE_URL: ${{ secrets.DASHBOARD_BASE_URL }}
          # Slack delivery. ONE run of this step does everything: it publishes
          # the report documents, posts each advisor's section to that
          # advisor's OWN channel, then posts the compact digest (one line +
          # links per advisor) to the main channel.
          #
          # Per-channel fan-out needs SLACK_BOT_TOKEN: an incoming webhook is
          # bound to a single channel and Slack ignores the `channel` field, so
          # with a webhook alone everything lands in one room.
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          # Legacy single-channel setting; SLACK_MAIN_CHANNEL wins when set.
          SLACK_CHANNEL: ${{ secrets.SLACK_CHANNEL }}
          # The main channel: it carries the SUMMARY only.
          SLACK_MAIN_CHANNEL: ${{ secrets.SLACK_MAIN_CHANNEL }}
          # One sub-channel per advisor of the CURRENT thirteen-advisor roster
          # (`ai_assistant.integrations.channel_config.ADVISOR_KEYS`; the env
          # var name is always SLACK_CHANNEL_<ADVISOR_KEY_UPPERCASE>). Create
          # them all with:
          #   python -m ai_assistant.integrations.slack_setup --apply
          # An unset secret is not an error: that advisor falls back to the
          # main channel.
          SLACK_CHANNEL_MORNING_OPERATIONS: ${{ secrets.SLACK_CHANNEL_MORNING_OPERATIONS }}
          SLACK_CHANNEL_COMMUNICATIONS_CALENDAR: ${{ secrets.SLACK_CHANNEL_COMMUNICATIONS_CALENDAR }}
          SLACK_CHANNEL_CAREER_DEVELOPMENT: ${{ secrets.SLACK_CHANNEL_CAREER_DEVELOPMENT }}
          SLACK_CHANNEL_MARKET_INTELLIGENCE: ${{ secrets.SLACK_CHANNEL_MARKET_INTELLIGENCE }}
          SLACK_CHANNEL_COMPLAINT_RADAR: ${{ secrets.SLACK_CHANNEL_COMPLAINT_RADAR }}
          SLACK_CHANNEL_DATA_ANALYST: ${{ secrets.SLACK_CHANNEL_DATA_ANALYST }}
          SLACK_CHANNEL_AI_INNOVATION: ${{ secrets.SLACK_CHANNEL_AI_INNOVATION }}
          SLACK_CHANNEL_KIDS_DEVELOPMENT: ${{ secrets.SLACK_CHANNEL_KIDS_DEVELOPMENT }}
          SLACK_CHANNEL_EXECUTIVE_COACHING: ${{ secrets.SLACK_CHANNEL_EXECUTIVE_COACHING }}
          SLACK_CHANNEL_WORK_ANALYST: ${{ secrets.SLACK_CHANNEL_WORK_ANALYST }}
          SLACK_CHANNEL_OPERATIONS_DIRECTOR: ${{ secrets.SLACK_CHANNEL_OPERATIONS_DIRECTOR }}
          SLACK_CHANNEL_SRE_WATCHDOG: ${{ secrets.SLACK_CHANNEL_SRE_WATCHDOG }}
          # Phase 2 advisors — all optional; a missing secret falls back to the
          # built-in default.
          JOB_KEYWORDS: ${{ secrets.JOB_KEYWORDS }}
          JOB_LOCATION: ${{ secrets.JOB_LOCATION }}
          USER_SECTOR: ${{ secrets.USER_SECTOR }}
          AI_NEWS_RSS_URL: ${{ secrets.AI_NEWS_RSS_URL }}
          SECTOR_NEWS_RSS_URL: ${{ secrets.SECTOR_NEWS_RSS_URL }}
          # Phase 3 advisors — all optional, all with built-in defaults.
          # Banking & contact-center project expert: news feed for real links.
          BANKING_NEWS_RSS_URL: ${{ secrets.BANKING_NEWS_RSS_URL }}
          BANKING_SECURITY_RSS_URL: ${{ secrets.BANKING_SECURITY_RSS_URL }}
          # Phase 4 advisors — optional, both have built-in defaults.
          # Yapay Zeka Ustalığı Koçu: skill level + free-training feed.
          AI_MASTERY_LEVEL: ${{ secrets.AI_MASTERY_LEVEL }}
          AI_MASTERY_RSS_URL: ${{ secrets.AI_MASTERY_RSS_URL }}
          # Çağrı Merkezi & Müşteri Deneyimi Araştırmacısı: research feed.
          CX_RESEARCH_RSS_URL: ${{ secrets.CX_RESEARCH_RSS_URL }}
          # Free certification hunter: announcements feed.
          FREE_CERTS_RSS_URL: ${{ secrets.FREE_CERTS_RSS_URL }}
          # Müşteri Şikayet & İtibar Radarı. Both feeds have built-in defaults
          # (Turkish Google News searches), so an unset secret still produces a
          # section. BRANDS/COMPETITORS have NO default — they name real
          # institutions — and an unset one simply drops that part of the
          # prompt; give them as comma-separated lists to enable it.
          COMPLAINT_RADAR_RSS_URL: ${{ secrets.COMPLAINT_RADAR_RSS_URL }}
          COMPLAINT_RADAR_SECTOR_RSS_URL: ${{ secrets.COMPLAINT_RADAR_SECTOR_RSS_URL }}
          COMPLAINT_RADAR_BRANDS: ${{ secrets.COMPLAINT_RADAR_BRANDS }}
          COMPLAINT_RADAR_COMPETITORS: ${{ secrets.COMPLAINT_RADAR_COMPETITORS }}
          # Findings ledger — what the team has ALREADY reported, so the extra
          # runs only bring new material. Leave this secret UNSET so the
          # built-in default (.assistant_state/findings.json) is used; that is
          # the path the commit-back step below persists.
          FINDINGS_MEMORY_FILE: ${{ secrets.FINDINGS_MEMORY_FILE }}
          FINDINGS_MEMORY_DAYS: ${{ secrets.FINDINGS_MEMORY_DAYS }}
          # A quiet incremental run stays out of Slack (default true). The full
          # 10:00 briefing always sends, whatever this is set to.
          SKIP_SLACK_WHEN_NOTHING_NEW: "true"
          # Accountability coach state file. Leave this secret UNSET so the
          # built-in default (.assistant_state/accountability.json) is used —
          # that is the path the commit-back step below persists. Pointing it
          # somewhere else silently disables the durable streak.
          ACCOUNTABILITY_STATE_FILE: ${{ secrets.ACCOUNTABILITY_STATE_FILE }}
          # Start-of-day ops briefing (Gmail + Calendar). There is no token file
          # on a runner, so the one-time local login's refresh token is passed
          # through the environment instead. Without these three the section
          # simply stays `skipped`.
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          # These only bound how much recent mail is read.
          OPS_BRIEFING_MAX_EMAILS: ${{ secrets.OPS_BRIEFING_MAX_EMAILS }}
          OPS_BRIEFING_EMAIL_WINDOW: ${{ secrets.OPS_BRIEFING_EMAIL_WINDOW }}
          # Drive root folder: where reports are archived.
          GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
          # Asana task sync. Without BOTH of the first two the sync is skipped
          # for every advisor (and now SAYS so in the run log instead of
          # reporting a success that never happened). ASANA_PROJECT_TEMPLATE is
          # optional; per-advisor overrides are ASANA_<ADVISOR_KEY>_PROJECT and
          # ASANA_<ADVISOR_KEY>_ASSIGNEE, added here only if you set them.
          ASANA_TOKEN: ${{ secrets.ASANA_TOKEN }}
          ASANA_WORKSPACE_ID: ${{ secrets.ASANA_WORKSPACE_ID }}
          ASANA_PROJECT_TEMPLATE: ${{ secrets.ASANA_PROJECT_TEMPLATE }}
          # LinkedIn integration — optional; missing secrets simply skip the section
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
        run: python -m ai_assistant.notifiers.slack_notifier

      # NOTE: there used to be a second step here, "Distribute digest to
      # advisor-specific channels", which called `build_digest()` AGAIN. That
      # ran the entire advisor team a second time — a second full set of LLM
      # calls against a free-tier quota — and then delivered a SECOND, different
      # set of messages that did not match the reports the dashboard had just
      # published. It also listed the pre-consolidation advisor keys, so nine of
      # the ten current advisors resolved to no channel at all.
      #
      # The step above now does the whole job in one pass: publish, fan out to
      # the sub-channels, summarise into the main channel. Do not add a second
      # delivery step; add channels to the env block above instead.

      # The runner filesystem is thrown away, so five artefacts are persisted
      # by committing them back to `main`:
      #   * the coach's streak/task memory, which is what makes its memory
      #     survive the ephemeral runner;
      #   * the findings ledger, which is what stops the later runs of the day
      #     from repeating what the morning briefing already said;
      #   * the dashboard's status.json, which is what the static site in
      #     `frontend/` renders (and what makes the run visible to the user);
      #   * frontend/metrics.json, the rolling token/latency history the
      #     performance tab charts — counts only, never a prompt or a key;
      #   * frontend/reports/, this run's per-advisor report documents — the
      #     readable pages Slack links to (see ai_assistant.reports).
      #
      # NOTE ON `[skip ci]`: this commit used to carry it, which told GitHub to
      # skip every workflow for the push — including the Pages deploy — so the
      # LIVE dashboard kept serving an older build while the repository already
      # had the fresh data. It is gone. (A push made with GITHUB_TOKEN cannot
      # trigger a workflow anyway, which is why `pages.yml` additionally listens
      # for THIS workflow finishing, via `workflow_run`.) Nothing here can loop:
      # this workflow is triggered only by `schedule` and `workflow_dispatch`,
      # never by `push`.
      #
      # Runs even when the briefing step failed (a failed run is exactly what
      # the dashboard must show) and NEVER fails the job: `continue-on-error`
      # plus an always-succeeding script mean a race or a protected branch can
      # cost the streak, never the briefing.
      - name: Persist advisor state, dashboard status and report documents
        if: always()
        continue-on-error: true
        env:
          STATE_PATHS: ".assistant_state/accountability.json .assistant_state/findings.json frontend/status.json frontend/metrics.json frontend/reports"
        run: |
          set -u
          PRESENT=""
          for path in $STATE_PATHS; do
            # -e, not -f: frontend/reports is a directory of documents.
            if [ -e "$path" ]; then
              PRESENT="$PRESENT $path"
            else
              echo "No path at $path — skipping it."
            fi
          done
          if [ -z "$PRESENT" ]; then
            echo "Nothing to persist."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # -A so pruned report days (older than the rolling window) are
          # recorded as deletions instead of lingering forever.
          git add -A -- $PRESENT
          if git diff --cached --quiet -- $PRESENT; then
            echo "Persisted files unchanged — nothing to commit."
            exit 0
          fi
          git commit -m "chore: persist advisor state, dashboard status and reports" -- $PRESENT
          # Another run (or a merge) may have moved main in the meantime, so
          # rebase and retry a few times before giving up.
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              echo "Persisted files pushed on attempt $attempt."
              exit 0
            fi
            echo "Push failed (attempt $attempt); rebasing onto origin/main."
            git pull --rebase --autostash origin main || break
            sleep $((attempt * 5))
          done
          echo "Could not persist state; the streak and the findings ledger restart, and the dashboard keeps the previous run."
          exit 0

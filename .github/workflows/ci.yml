name: CI

# Deliberately UNFILTERED. The Daily Briefing job commits its run artefacts
# back to `main` several times a day and those commits contain no code, so a
# `paths-ignore` filter here would save a little CI time — but path filtering is
# also the class of change that can silently stop a required check from running
# at all, and a repository where "tests did not run" looks the same as "tests
# passed" is worse than one that runs a three-minute suite too often.
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: test_db
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          # `|| true` kaldırıldı: bu kurulum gerçekten çalışıyor (doğrulandı,
          # exit 0). Kurulumun sessizce başarısız olabilmesi, sonraki adımların
          # eksik araçlarla koşmasına ve "yeşil" görünmesine yol açıyordu.
          # Pin çakışması ARTIK YOK: backend/requirements-dev.txt pytest'i
          # `>=8.0.0,<10`, backend/requirements.txt httpx'i `>=0.27.0,<0.28.0`
          # istiyor — ikisi de kök pyproject.toml ile aynı. Bu satır artık
          # hiçbir şeyi düşürmüyor.
          pip install -r backend/requirements-dev.txt

      - name: Check JavaScript syntax
        run: |
          if [ -f frontend/app.js ]; then
            node --check frontend/app.js
          fi
          if [ -f frontend/charts.js ]; then
            node --check frontend/charts.js
          fi

      # continue-on-error KALDIRILDI: backend/ artık black'e tam uyumlu
      # (43 dosya, `black --check backend/` exit 0). Adım bastırılmadığı için
      # bundan sonra formatı bozan bir PR CI'ı gerçekten kırar.
      - name: Lint with black
        run: |
          black --check backend/

      # `--exit-zero` KALDIRILDI. Daha önce 109, en son 20 uyarı vardı ve
      # hepsi temizlendi (14 F401, 4 E501, 1 E712 — bkz. 35fe99e); şimdi
      # `flake8 backend/` sıfır bulguyla exit 0 dönüyor.
      # Kapsam bilinçli olarak backend/: src/ ve tests/ hiç black'ten
      # geçmedi ve repo genelinde hâlâ ~2000 E501 var. Onları da bu kapıya
      # sokmak, gerçek bulguları gömen bir gürültü yığını demek olurdu.
      - name: Lint with flake8
        run: |
          flake8 backend/ --count --max-complexity=10

      - name: Run main tests
        run: pytest -q

      # Backend suite ARTIK KOŞUYOR. Daha önce collection aşamasında çöküyordu
      # (pytest exit 4, 0 test): `metadata` SQLAlchemy Declarative Base'de
      # ayrılmış bir addır ve beş model onu kolon adı olarak kullanıyordu.
      # Python attribute'ları `extra_metadata` oldu, DB kolon adı `metadata`
      # kaldı — schema.sql'e dokunmaya gerek yok.
      #
      # continue-on-error ARTIK YOK: daha önce düşen 16 testin ikisi de
      # düzeltildi (fixture sırası + `app/dependencies.py`'deki yer tutucu
      # auth'un JWT ile değiştirilmesi). Suite şimdi 122 test, hepsi geçiyor.
      # Bu adım CI'da bir postgres service'ine bağlı; yerelde `.env` olmadan
      # aynı komutla doğrulandı (exit 0).
      - name: Run backend tests
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_db
        run: |
          pytest backend/tests/ -v --cov=backend/app --cov-report=xml --cov-report=term-missing

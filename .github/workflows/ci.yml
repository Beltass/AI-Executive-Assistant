name: CI

on:
  push:
    # The Daily Briefing job commits its run artefacts back to `main` several
    # times a day. Those commits contain no code, so re-running the test matrix
    # on them is pure noise. Pull requests are unaffected (the `pull_request`
    # trigger below has no filter), so nothing can merge without a green suite.
    paths-ignore:
      - "frontend/status.json"
      - "frontend/reports/**"
      - ".assistant_state/**"
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        run: pytest -q

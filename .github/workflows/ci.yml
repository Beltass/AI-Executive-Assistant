name: CI

# Deliberately UNFILTERED. The Daily Briefing job commits its run artefacts
# back to `main` several times a day and those commits contain no code, so a
# `paths-ignore` filter here would save a little CI time — but path filtering is
# also the class of change that can silently stop a required check from running
# at all, and a repository where "tests did not run" looks the same as "tests
# passed" is worse than one that runs a three-minute suite too often.
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: test_db
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install -r backend/requirements-dev.txt || true

      - name: Check JavaScript syntax
        run: |
          if [ -f frontend/app.js ]; then
            node --check frontend/app.js
          fi
          if [ -f frontend/charts.js ]; then
            node --check frontend/charts.js
          fi

      - name: Lint with black
        run: |
          black --check backend/ || true

      - name: Lint with flake8
        run: |
          flake8 backend/ --count --exit-zero --max-complexity=10 || true

      - name: Run main tests
        run: pytest -q

      - name: Run backend tests
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_db
        run: |
          pytest backend/tests/ -v --cov=backend/app --cov-report=xml --cov-report=term-missing || true

name: Meeting Notes Poller

# Polls for new meeting audio files (via Gmail), transcribes, analyzes,
# generates reports, and tracks action items. Runs every 30 minutes.
#
# Flow:
#   1. Check Gmail for new audio file links (Drive/Dropbox)
#   2. Transcribe audio with Speech-to-Text
#   3. Analyze with LLM (extract actions, competitive intel, etc.)
#   4. Generate reports (PDF, Google Doc, Excel)
#   5. Create tasks in tracker with deadlines
#   6. Send Slack notifications for deadlines
#   7. Sync tasks to Drive

on:
  schedule:
    # Every 30 minutes
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      email_query:
        description: "Gmail query (default: 'from:notifications has:attachment')"
        required: false
        default: "from:notifications has:attachment"

concurrency:
  group: meeting-notes-poller
  cancel-in-progress: false

jobs:
  poll_meetings:
    runs-on: ubuntu-latest
    # İşlenmiş toplantı listesi koşu sonunda `main`e commit edilir; runner'ın
    # diski atıldığı için bunu kalıcı kılan tek şey budur. `contents: read`
    # olduğu sürece liste HİÇ yazılmaz ve her yoklama aynı toplantıları
    # baştan işler.
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          # Durum dosyasını ayrık bir HEAD'e değil varsayılan dala yaz; push
          # edebilmek için token çıkışta kalsın.
          ref: main
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          pip install -e .

      - name: Configure Google OAuth
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
        run: |
          cat > .env << EOF
          GOOGLE_CLIENT_ID=$GOOGLE_CLIENT_ID
          GOOGLE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET
          GOOGLE_REFRESH_TOKEN=$GOOGLE_REFRESH_TOKEN
          GOOGLE_DRIVE_FOLDER_ID=$GOOGLE_DRIVE_FOLDER_ID
          MEETING_NOTES_ENABLED=true
          GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
          SLACK_BOT_TOKEN=${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_MAIN_CHANNEL=${{ secrets.SLACK_MAIN_CHANNEL }}
          SLACK_CHANNEL_MEETING_PREP=${{ secrets.SLACK_CHANNEL_MEETING_PREP }}
          EOF

      - name: Poll and process meetings
        run: |
          python -m ai_assistant.integrations.meeting_notes_poller \
            --email-query="${{ github.event.inputs.email_query || 'from:notifications has:attachment' }}" \
            --auto-transcribe=true \
            --generate-reports=true

      # Runner'ın diski atılır. HANGİ TOPLANTININ İŞLENDİĞİNİ KALICI KILAN TEK
      # ŞEY bu adımdır: `.assistant_state/processed_meetings.json` commit
      # edilmezse bir sonraki yoklama listeyi boş görür ve aynı kayıtları
      # yeniden transkribe edip yeniden raporlar.
      #
      # `chat-poller.yml` ile AYNI deyim: değişmediyse sessizce çık, hata olsa
      # da işi düşürme, `main` bu arada oynadıysa rebase edip yeniden dene.
      # Bir yoklamayı kaçırmak katlanılabilir; kırmızı yanan bir cron
      # düzeltilmeyen bir cron olur.
      - name: Toplantı durumunu kalıcılaştır
        if: always()
        continue-on-error: true
        env:
          STATE_PATHS: ".assistant_state/processed_meetings.json"
        run: |
          set -u
          PRESENT=""
          for path in $STATE_PATHS; do
            if [ -e "$path" ]; then
              PRESENT="$PRESENT $path"
            else
              echo "$path yok — atlanıyor."
            fi
          done
          if [ -z "$PRESENT" ]; then
            echo "Kalıcılaştırılacak bir şey yok."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- $PRESENT
          if git diff --cached --quiet -- $PRESENT; then
            echo "Toplantı durumu değişmedi — commit yok."
            exit 0
          fi
          git commit -m "chore: persist processed meetings" -- $PRESENT
          # Sohbet yoklayıcısı ve günlük brifing de `main`e yazar; araya girmiş olabilir.
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              echo "Toplantı durumu $attempt. denemede gönderildi."
              exit 0
            fi
            echo "Push başarısız ($attempt. deneme); origin/main üzerine rebase ediliyor."
            git pull --rebase --autostash origin main || break
            sleep $((attempt * 5))
          done
          echo "Toplantı durumu yazılamadı; bir sonraki yoklama son commit edilen listeden devam eder."

      - name: Cleanup
        if: always()
        run: |
          rm -f .env
          rm -f /tmp/meeting_*.mp3 /tmp/tasks_*.csv 2>/dev/null || true
